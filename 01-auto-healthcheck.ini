#!name=启动与定时测速
#!desc=当前运行配置的策略组启动后测速，之后每300秒检测；保留手动选择与Smart组类型。

[YAML]
proxy-groups*:
  where:
    type: '/^(select|url-test|fallback|load-balance|smart)$/'
  set:
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: false
    expected-status: '204'

# use 引用的代理集合有独立健康检查，不能只设置组的 lazy。
# 不存在 proxy-providers 时不会创建任何代理集合。
proxy-providers*:
  where:
    type: '/^(http|file|inline)$/'
  set:
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: '204'
