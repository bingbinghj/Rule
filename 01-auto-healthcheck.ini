#!name=启动与定时测速＋500ms重测
#!desc=启动及每300秒测速；配合01-auto-healthcheck-500ms.sh，节点选择任一项超过500ms或测速超时/失败时重测整组，冷却300秒。

# hc500-auto-healthcheck
# 500ms是重新测速阈值，timeout仍为5000ms。
# INI不支持按延迟触发；阈值监测由配套Shell脚本安装的定时任务执行。

[YAML]
proxy-groups*:
  where:
    type: '/^(select|url-test|fallback|load-balance|smart)$/'
  set:
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: false
    expected-status: '204'

# use 引用的代理集合有独立健康检查，不能只设置组的 lazy。
# 不存在 proxy-providers 时不会创建任何代理集合。
proxy-providers*:
  where:
    type: '/^(http|file|inline)$/'
  set:
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: '204'
