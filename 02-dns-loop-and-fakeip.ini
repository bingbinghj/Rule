#!name=双栈DNS与Fake-IP
#!desc=先完成爱快LAN1到OpenWrt eth0的Fake IPv6静态路由，再启用；只需一条IPv6外网。依赖「🚀 节点选择」，持久化由可选03模块控制。

[General]
IPV6_ENABLE = 1
IPV6_DNS = 1
IPV6_MODE = 3
ENABLE_V6_UDP_PROXY = 1
FAKEIP_RANGE6 = 2001:2::1/64

[YAML]
ipv6: true
dns:
  ipv6: true
  # 此段仅作内部Fake-IP地址池，不是公网前缀，也不是网卡地址。
  # 爱快需把2001:2::/64路由到OpenWrt，两个地方必须一致。
  fake-ip-range6: 2001:2::1/64
  respect-rules: false
  # 引导解析与节点服务器解析必须能独立于代理工作。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: false
  # MosDNS已分流；需要真实IP的其余域名经选定代理查询。
  # 避免回送127.0.0.1:53、:5337或:5335。
  nameserver:
    - 'https://1.1.1.1/dns-query#🚀 节点选择'
    - 'https://8.8.8.8/dns-query#🚀 节点选择'
  fallback: []
